<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>여행 플래너</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/colors.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- 상단: 나라 선택 · 탭 · 계획/대시보드 -->
<header class="top">
  <div class="brand">✈️ <span class="bt">여행 플래너</span></div>
  <div class="cwrap" id="cwrap"></div>
  <nav class="tabs" id="tabs"></nav>
  <span class="sync" id="sync" role="status" hidden></span>
  <div class="seg" id="seg"></div>
</header>

<!-- 일정 · 계획 모드: 보관함 | Day 칸 | 지도 -->
<main class="planner" id="planner">
  <aside class="wish">
    <div class="sw" id="sw"></div>
    <div class="sec">보관함 <span id="wcount"></span></div>
    <div class="cats" id="wcats"></div>
    <div class="wlist" id="wishlist"></div>
    <button class="addw" data-a="wmanual">+ 직접 추가</button>
    <p class="hint">카드를 Day 칸으로 끌어다 놓으세요.<br>태블릿·폰에서는 길게 눌러서 잡아요.</p>
  </aside>
  <section class="main">
    <div class="bar" id="bar"></div>
    <div class="board" id="board"></div>
  </section>
  <section class="mapwrap">
    <div class="maph" id="pmh"></div>
    <div class="mn mfp" id="pmf" hidden></div>
    <div class="mapslot" id="pslot"><div id="map"></div></div>
    <div class="legend" id="plg"></div>
  </section>
</main>

<!-- 일정 · 대시보드 모드: 지도 | Day별 일정 | 후보군  (휴대폰은 위에서 아래로 같은 순서) -->
<main class="dash" id="dash" hidden>
  <section class="mapwrap dmap">
    <div class="maph" id="dmh"></div>
    <div class="mn mfp" id="dmf" hidden></div>
    <div class="mapslot" id="dslot"></div>
    <div class="legend" id="dlg"></div>
  </section>
  <div class="sec secf" data-a="fold" data-f="days">일정 <span class="chev">▾</span></div>
  <div class="days" id="ddays"></div>
  <section class="cands">
    <div class="sec" data-a="fold" data-f="cands">후보 <span><span id="ccount"></span><span class="chev"> ▾</span></span></div>
    <p class="chint">시간이 남거나 계획이 바뀌면 여기서 골라요</p>
    <ul class="tl" id="cands"></ul>
  </section>
</main>

<!-- 준비 / 예산 / 날씨 탭 -->
<main class="page" id="prep" hidden></main>
<main class="page" id="bud" hidden></main>
<main class="page" id="wxt" hidden></main>

<!-- 장소 상세 패널 -->
<div class="scrim" id="scrim" data-a="close" hidden></div>
<aside class="drawer" id="drawer" aria-label="장소 상세"></aside>

<script type="module" src="js/main.js"></script>
</body>
</html>
