<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>여행 플래너</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/colors.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- 상단: 나라 선택 · 탭 -->
<header class="top">
  <div class="brand">✈️ <span class="bt">여행 플래너</span></div>
  <div class="cwrap" id="cwrap"></div>
  <nav class="tabs" id="tabs"></nav>
  <span class="sync" id="sync" role="status" hidden></span>
</header>

<!-- 일정 탭: (보관함) | Day별 일정 | 지도   — 휴대폰은 지도 → 일정, 보관함은 아래에서 올라오는 창 -->
<main class="trip" id="trip">
  <aside class="wish" id="wishp" aria-label="보관함">
    <div class="sec"><b>📥 보관함 <span id="wcount"></span></b><button class="x" data-a="wisht" aria-label="보관함 닫기">✕</button></div>
    <button class="addw" data-a="wmanual">+ 보관함에 장소 추가</button>
    <button class="addw gl" data-a="glopen">🔗 구글 목록 불러오기</button>
    <div class="wlist" id="wishlist"></div>
    <p class="hint" id="whint">카드를 Day로 끌어다 놓거나, 눌러서 Day를 고르세요.<br>휴대폰에서는 길게 눌러서 잡아요.</p>
  </aside>
  <section class="plan">
    <div class="bar" id="bar"></div>
    <div class="dchips" id="dchips"></div>
    <div class="days" id="days"></div>
  </section>
  <section class="mapwrap" id="mapw">
    <div class="maph" id="mh"></div>
    <div class="mn mfp" id="mf" hidden></div>
    <div class="mapslot"><div id="map"></div></div>
    <div class="legend" id="lg"></div>
  </section>
</main>

<!-- 준비 / 예산 / 날씨 탭 -->
<main class="page" id="prep" hidden></main>
<main class="page" id="bud" hidden></main>
<main class="page" id="wxt" hidden></main>

<!-- 오른쪽 패널: 장소 상세 · 장소 추가 · 여행 설정 -->
<div class="scrim" id="scrim" data-a="close" hidden></div>
<aside class="drawer" id="drawer" aria-label="장소 상세"></aside>

<script type="module" src="js/main.js"></script>
</body>
</html>
